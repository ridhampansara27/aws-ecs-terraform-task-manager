name: Deploy to AWS ECS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show GitHub repository context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ vars.ECS_TASK_DEFINITION }}" \
            --query taskDefinition \
            > task-definition.json

      - name: Remove read-only ECS task definition fields
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy
          )' task-definition.json > task-definition-clean.json

      - name: Render new application image
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition-clean.json
          container-name: api
          image: ${{ steps.build-image.outputs.image }}

      - name: Register new ECS task definition
        id: register-task-definition
        shell: bash
        run: |
          TASK_DEFINITION_FILE="${{ steps.task-definition.outputs.task-definition }}"

          if [ -z "$TASK_DEFINITION_FILE" ]; then
            echo "Rendered task definition file path is empty."
            exit 1
          fi

          if [ ! -f "$TASK_DEFINITION_FILE" ]; then
            echo "Rendered task definition file does not exist: $TASK_DEFINITION_FILE"
            exit 1
          fi

          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://$TASK_DEFINITION_FILE" \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          if [ -z "$TASK_DEFINITION_ARN" ] || [ "$TASK_DEFINITION_ARN" = "None" ]; then
            echo "Failed to register ECS task definition."
            exit 1
          fi

          echo "Registered task definition: $TASK_DEFINITION_ARN"
          echo "task-definition-arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        shell: bash
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_TASK_DEFINITION: ${{ steps.register-task-definition.outputs.task-definition-arn }}
          ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
          ECS_SECURITY_GROUP: ${{ vars.ECS_SECURITY_GROUP }}
        run: |
          if [ -z "$ECS_TASK_DEFINITION" ]; then
            echo "ECS task definition ARN is empty."
            exit 1
          fi

          MIGRATION_TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$ECS_TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$ECS_SUBNETS],securityGroups=[$ECS_SECURITY_GROUP],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["python","-m","alembic","upgrade","head"]}]}' \
            --query "tasks[0].taskArn" \
            --output text)

          if [ -z "$MIGRATION_TASK_ARN" ] || [ "$MIGRATION_TASK_ARN" = "None" ]; then
            echo "ECS migration task was not started."
            exit 1
          fi

          echo "Migration task ARN: $MIGRATION_TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$MIGRATION_TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$MIGRATION_TASK_ARN" \
            --query "tasks[0].containers[0].exitCode" \
            --output text)

          STOPPED_REASON=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$MIGRATION_TASK_ARN" \
            --query "tasks[0].stoppedReason" \
            --output text)

          echo "Migration exit code: $EXIT_CODE"
          echo "Migration stopped reason: $STOPPED_REASON"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Database migration failed."
            exit 1
          fi

          echo "Database migration completed successfully."

      - name: Deploy registered task definition to ECS
        shell: bash
        env:
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_SERVICE: ${{ vars.ECS_SERVICE }}
          ECS_TASK_DEFINITION: ${{ steps.register-task-definition.outputs.task-definition-arn }}
        run: |
          if [ -z "$ECS_TASK_DEFINITION" ]; then
            echo "ECS task definition ARN is empty."
            exit 1
          fi

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$ECS_TASK_DEFINITION"

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "ECS deployment completed successfully."

      - name: Smoke test application
        env:
          ALB_DNS: ${{ vars.ALB_DNS }}
        run: |
          curl --fail \
            --retry 10 \
            --retry-delay 10 \
            "http://$ALB_DNS/health"